<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><style>text{font-family:Inter,sans-serif}</style><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feFlood flood-color="#0B2436" flood-opacity=".04"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="1"/><feOffset dy="1"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0" y="0" width="1440" height="900" rx="0" fill="#F4F8FB" /><rect x="60" y="40" width="40" height="40" rx="12" fill="#005687" /><g transform="translate(69 49)" fill="none" stroke="white" stroke-width="1.7"><rect width="22" height="22" rx="2"/><path d="M11 0v22M0 11h22"/></g><text x="111" y="67" font-size="21" fill="#0B2436" font-weight="700" text-anchor="start">Courtly</text><rect x="60" y="160" width="540" height="620" rx="22" fill="#E5F0F5" /><text x="100" y="310" font-size="36" fill="#0B2436" font-weight="700" text-anchor="start">Welcome to Courtly</text><text x="100" y="350" font-size="17" fill="#4F6B7A" font-weight="400" text-anchor="start">Manage your bookings in one place.</text><rect x="720" y="230" width="460" height="460" rx="18" fill="white" filter="url(#shadow)"/><text x="748" y="284" font-size="28" fill="#0B2436" font-weight="700" text-anchor="start">Sign in</text><text x="748" y="314" font-size="15" fill="#4F6B7A" font-weight="400" text-anchor="start">Enter your account details to continue.</text><text x="748" y="360" font-size="14" fill="#0B2436" font-weight="600" text-anchor="start">Email</text><rect x="748" y="372" width="404" height="48" rx="10" fill="white" stroke="#D7E5EB"/><text x="762" y="402" font-size="15" fill="#0B2436" font-weight="400" text-anchor="start">you@example.com</text><text x="748" y="450" font-size="14" fill="#0B2436" font-weight="600" text-anchor="start">Password</text><rect x="748" y="462" width="404" height="48" rx="10" fill="white" stroke="#D7E5EB"/><text x="762" y="492" font-size="15"