<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920"><style>text{font-family:Inter,sans-serif}</style><defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feFlood flood-color="#0B2436" flood-opacity=".04"/><feComposite in2="SourceAlpha" operator="in"/><feGaussianBlur stdDeviation="1"/><feOffset dy="1"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0" y="0" width="1600" height="920" rx="0" fill="#F4F8FB" /><text x="40" y="58" font-size="30" fill="#0B2436" font-weight="700" text-anchor="start">Booking flow · state examples</text><text x="40" y="90" font-size="15" fill="#4F6B7A" font-weight="400" text-anchor="start">Static design states, not a separate route.</text><rect x="40" y="120" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="64" y="160" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">Loading</text><text x="64" y="203" font-size="16" fill="#4F6B7A" font-weight="400" text-anchor="start">Loading available times…</text><rect x="64" y="230" width="432" height="48" rx="10" fill="#F1F5F7" /><rect x="64" y="292" width="432" height="48" rx="10" fill="#F1F5F7" /><rect x="560" y="120" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="584" y="160" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">No available hours</text><text x="584" y="205" font-size="16" fill="#0B2436" font-weight="400" text-anchor="start">No bookable hours for this date.</text><text x="584" y="234" font-size="15" fill="#4F6B7A" font-weight="400" text-anchor="start">Choose another day or week.</text><rect x="1080" y="120" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="1104" y="160" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">No bookings yet</text><text x="1104" y="205" font-size="16" fill="#4F6B7A" font-weight="400" text-anchor="start">Your bookings will appear here.</text><rect x="1104" y="265" width="210" height="48" rx="24" fill="#005687" /><text x="1209" y="295" font-size="15" fill="white" font-weight="600" text-anchor="middle">View courts</text><rect x="40" y="500" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="64" y="540" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">Connection problem</text><text x="64" y="583" font-size="16" fill="#0B2436" font-weight="400" text-anchor="start">We could not confirm the result.</text><text x="64" y="612" font-size="15" fill="#4F6B7A" font-weight="400" text-anchor="start">Check My bookings before trying again.</text><rect x="64" y="672" width="250" height="48" rx="24" fill="#005687" /><text x="189" y="702" font-size="15" fill="white" font-weight="600" text-anchor="middle">Go to my bookings</text><rect x="560" y="500" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="584" y="540" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">Cancellation window closed</text><text x="584" y="583" font-size="17" fill="#0B2436" font-weight="700" text-anchor="start">Court 1</text><rect x="584" y="608" width="432" height="76" rx="10" fill="#FFF1F1" /><text x="600" y="639" font-size="14" fill="#E7000B" font-weight="600" text-anchor="start">This booking can no longer be cancelled.</text><text x="600" y="662" font-size="14" fill="#E7000B" font-weight="400" text-anchor="start">Bookings have been refreshed.</text><rect x="1080" y="500" width="480" height="340" rx="18" fill="white" filter="url(#shadow)"/><text x="1104" y="540" font-size="20" fill="#0B2436" font-weight="700" text-anchor="start">Booking cancelled</text><text x="1104" y="583" font-size="16" fill="#0B2436" font-weight="600" text-anchor="start">Your booking has been cancelled.</text><text x="1104" y="612" font-size="14" fill="#4F6B7A" font-weight="400" text-anchor="start">Court 1 · Tuesday, December 1, 2026</text></svg>