<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1130" viewBox="0 0 390 1130">
<style>text{font-family:Arial,sans-serif;fill:#222}.muted{fill:#666}.small{font-size:13px}.body{font-size:15px}.bold{font-weight:700}.title{font-size:28px;font-weight:700}.line{stroke:#bbb;stroke-width:1}</style>
<rect width="390" height="1130" fill="white"/>
<text x="24" y="38" class="bold" >Courtly</text>
<text x="366" y="38" class="body" text-anchor="end">Menu</text>
<line x1="0" y1="62" x2="390" y2="62" class="line"/>
<text x="20" y="104" class="small" text-decoration="underline">Courts</text>
<text x="65" y="104" class="small muted" >/</text>
<text x="78" y="104" class="small" >Edit court</text>
<text x="20" y="139" class="title" >Edit court</text>
<rect x="20" y="168" width="350" height="590" rx="5" fill="white" stroke="#bbb"/>
<text x="40" y="198" class="body" >Name</text>
<rect x="40" y="208" width="310" height="44" rx="5" fill="white" stroke="#bbb"/>
<text x="52" y="236" class="body" >Court 1</text>
<text x="40" y="280" class="body" >Sport</text>
<rect x="40" y="290" width="310" height="44" rx="5" fill="white" stroke="#bbb"/>
<text x="52" y="318" class="body" >Padel</text>
<text x="40" y="362" class="body" >Hourly price ($)</text>
<rect x="40" y="372" width="310" height="44" rx="5" fill="white" stroke="#bbb"/>
<text x="52" y="400" class="body" >50.00</text>
<text x="40" y="444" class="body" >Opens at</text>
<rect x="40" y="454" width="310" height="44" rx="5" fill="white" stroke="#bbb"/>
