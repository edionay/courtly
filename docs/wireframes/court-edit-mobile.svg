<text x="52" y="564" class="body" >22:00</text>
<text x="40" y="606" class="small muted" >Choose whole hours.</text>
<rect x="40" y="648" width="18" height="18" rx="5" fill="white" stroke="#bbb"/>
<path d="M 43 657 l 4 4 l 7 -8" fill="none" stroke="#222" stroke-width="2"/>
<text x="69" y="663" class="body" >Available for bookings</text>
<text x="40" y="691" class="small muted" >Turning this off prevents new bookings.</text>
<text x="40" y="710" class="small muted" >Existing bookings and history are preserved.</text>
<rect x="20" y="778" width="350" height="48" rx="5" fill="#e8e8e8" stroke="#888"/>
<text x="195.0" y="808" class="bold" text-anchor="middle">Save changes</text>
<text x="195.0" y="856" class="body" text-anchor="middle" text-decoration="underline">Cancel</text>
