services:
  database:
    environment:
      POSTGRES_DB: courtly_performance
    volumes:
      - performance-data:/var/lib/postgresql/data

  backend:
    volumes:
      - ./docs/performance/manifests:/app/docs/performance/manifests
    environment:
      DATABASE_URL: postgresql://courtly:courtly-local@database:5432/courtly_performance?schema=public

  frontend:

volumes:
  performance-data:
