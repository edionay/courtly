services:
  database:
    environment:
      POSTGRES_DB: courtly_performance
    volumes:
      - performance-data:/var/lib/postgresql/data

  backend:
    volumes:
      - ./docs/performance/manifests:/app/docs/performance/manifests
    environment:
      DATABASE_URL: postgresql://courtly:courtly-local@database:5432/courtly_performance?schema=public

  frontend:

  k6:
    image: grafana/k6:2.4.0
    profiles: [performance]
    entrypoint: ["k6"]
    command: ["version"]
    volumes:
      - ./docs/performance/k6:/scripts:ro
      - ./docs/performance/manifests:/manifests:ro
      - ./docs/performance/results:/results

volumes:
  performance-data:
