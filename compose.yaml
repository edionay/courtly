services:
  database:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_DB: courtly
      POSTGRES_USER: courtly
      POSTGRES_PASSWORD: courtly-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courtly -d courtly"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://courtly:courtly-local@database:5432/courtly?schema=public
      PORT: 3000
      JWT_SECRET: ${COURTLY_JWT_SECRET:-courtly-local-development-secret-key-at-least-32}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${COURTLY_API_PORT:-3100}:3000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_PROXY_TARGET: http://backend:3000
    depends_on:
      - backend
    ports:
      - "${COURTLY_WEB_PORT:-4174}:4173"

  storybook:
    profiles: ["storybook"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    command:
      - npm
      - run
      - storybook
      - --workspace
      - frontend
      - --
      - --ci
      - --no-open
      - --exact-port
    ports:
      - "${COURTLY_STORYBOOK_PORT:-6006}:6006"

volumes:
  postgres-data:
